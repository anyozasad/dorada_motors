name: dorada_motors
description: "Aplicación de repuestos para motocicletas y motokar."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  crypto: ^3.0.6
  http: ^1.2.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  sqflite: ^2.4.2
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true

  assets:
    - assets/imagenes/
