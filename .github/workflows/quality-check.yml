name: Dorada Motors Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php:
    name: PHP syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: PHP lint
        run: find PHP/dorada_api -type f -name "*.php" -print0 | xargs -0 -n1 php -l
      - name: Dashboard 150 structural validation
        run: php PHP/VALIDAR_DASHBOARD_150.php

  flutter:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test

  integration:
    name: PHP + MySQL integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptestpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli
      - name: Probar registro, login, carrito, favoritos, stock y pedidos
        run: |
          mkdir -p PHP/dorada_api/data
          printf '{"costo_delivery":5}' > PHP/dorada_api/data/config_empresa.json
          DB_HOST=127.0.0.1 DB_USER=root DB_PASS=testpass DB_NAME=dorada_motors DB_PORT=3306 php -S 127.0.0.1:8090 -t PHP/dorada_api > /tmp/dorada-php.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          if ! python3 PHP/tests/integration_smoke.py; then
            echo "=== Registro del servidor PHP ==="
            tail -n 100 /tmp/dorada-php.log
            exit 1
          fi

  windows-scripts:
    name: PowerShell scripts syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar sintaxis de los scripts Windows
        shell: pwsh
        run: |
          $archivos = @(
            'PHP/INICIAR_DEMO.ps1',
            'PHP/VERIFICAR_SISTEMA.ps1',
            'PHP/PREPARAR_ENTREGA_INDICADOR_II.ps1',
            'PHP/PREPARAR_ENTREGA_INDICADOR_IV.ps1',
            'PREPARAR_ENTREGA_INDICADOR_IV.ps1'
          )
          foreach ($archivo in $archivos) {
            $tokens = $null
            $errores = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path (Get-Location) $archivo),
              [ref]$tokens,
              [ref]$errores
            )
            if ($errores.Count -gt 0) {
              throw "Sintaxis PowerShell inválida: $archivo; $($errores -join '; ')"
            }
            Write-Host "OK: $archivo"
          }
      - name: Crear ZIP completo de entrega para el profesor
        shell: pwsh
        run: |
          & .\PHP\PREPARAR_ENTREGA_INDICADOR_IV.ps1
          $archivoZip = Join-Path ([Environment]::GetFolderPath('Desktop')) 'INDICADOR_IV_DORADA_MOTORS.zip'
          if (!(Test-Path $archivoZip)) { throw "No se creó el ZIP completo de Dorada Motors" }
          $tamano = (Get-Item $archivoZip).Length
          if ($tamano -lt 100000) { throw "El ZIP de entrega está vacío o incompleto: $tamano bytes" }
          Copy-Item $archivoZip (Join-Path $env:GITHUB_WORKSPACE 'INDICADOR_IV_DORADA_MOTORS.zip') -Force
          Write-Host "ZIP de entrega verificado: $tamano bytes"
      - name: Publicar ZIP completo y paquetes separados
        uses: actions/upload-artifact@v4
        with:
          name: Dorada-Motors-Entrega-Completa
          path: INDICADOR_IV_DORADA_MOTORS.zip
          if-no-files-found: error
          retention-days: 14

  browser-e2e:
    name: Prueba real de navegador Chrome
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptestpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Playwright y Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Probar formularios, búsqueda, Kardex y navegación móvil
        run: |
          mkdir -p PHP/dorada_api/data
          printf '{"costo_delivery":5}' > PHP/dorada_api/data/config_empresa.json
          DB_HOST=127.0.0.1 DB_USER=root DB_PASS=testpass DB_NAME=dorada_motors DB_PORT=3306 php -S 127.0.0.1:8090 -t PHP/dorada_api > /tmp/dorada-browser-php.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          if ! python PHP/tests/browser_e2e.py; then
            echo "=== Registro del servidor PHP del navegador ==="
            tail -n 120 /tmp/dorada-browser-php.log
            exit 1
          fi
      - name: Guardar capturas reales del navegador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dorada-Motors-evidencias-navegador
          path: artifacts/ui/*.png
          if-no-files-found: warn
          retention-days: 14
