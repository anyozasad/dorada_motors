name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar codigo
        run: flutter analyze

      - name: Ejecutar pruebas
        run: flutter test

      - name: Compilar Flutter Web para presentación
        run: flutter build web --release

  android-apk:
    name: Compilar APK Android de prueba
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Flutter
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Java para Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Instalar paquetes
        run: flutter pub get
      - name: Compilar APK de prueba
        run: flutter build apk --debug
      - name: Publicar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: Dorada-Motors-Android-debug
          path: Flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
