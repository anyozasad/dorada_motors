name: Flutter CI

# Solo compilar la revisión vigente para no acumular APK de commits antiguos.
concurrency:
  group: dorada-flutter-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar codigo
        run: flutter analyze

      - name: Ejecutar pruebas
        run: flutter test

      - name: Compilar Flutter Web para presentación
        run: flutter build web --release

  android-apk:
    name: Compilar APK Android de prueba
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Flutter
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Java para Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Instalar paquetes
        run: flutter pub get
      - name: Configurar Maven Central para Gradle y plugins de Flutter
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/maven-central.gradle" <<'GRADLE'
          gradle.beforeSettings { settings ->
              settings.pluginManagement.repositories {
                  mavenCentral()
                  google()
                  gradlePluginPortal()
              }
          }
          GRADLE
      - name: Compilar APK instalable para el teléfono
        run: flutter build apk --release

      - name: Publicar APK para celular Android
        uses: actions/upload-artifact@v4
        with:
          name: Dorada-Motors-APK-Para-Celular
          path: Flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
