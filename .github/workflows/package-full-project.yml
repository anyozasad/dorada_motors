name: Package Dorada Motors Full Project

on:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Prepare full project package
        run: |
          mkdir -p package/dorada_motors
          rsync -a --exclude='.git' --exclude='package' ./ package/dorada_motors/

      - name: Upload complete project
        uses: actions/upload-artifact@v4
        with:
          name: DORADA_MOTORS_COMPLETO_ACTUALIZADO
          path: package/dorada_motors
          if-no-files-found: error
          retention-days: 7
